name: Validate package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  javascript:
    name: JavaScript tests and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        id: node_dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm test
      - name: Check the committed bundle
        if: ${{ !cancelled() && steps.node_dependencies.outcome == 'success' }}
        run: npm run check:dist

  heating:
    name: Heating kit
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install heating test dependencies
        run: python -m pip install -r tests/requirements-heating.txt
      - name: Run heating kit tests
        run: python tests/test_heating_kit.py

  browser:
    name: Browser tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [chromium, webkit, standalone]
    env:
      BAYIT_BROWSER_SUITE: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build the dashboard bundle for browser checks
        run: npm run build
      - name: Install browsers
        run: |
          if [[ "$BAYIT_BROWSER_SUITE" == standalone ]]; then
            npx playwright-core install --with-deps chromium webkit
          else
            npx playwright-core install --with-deps "$BAYIT_BROWSER_SUITE"
          fi
      - name: Run browser checks
        run: |
          mkdir -p test-results/package
          npm run test:browser 2>&1 | tee test-results/package/browser.log
      - name: Save browser failure output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-browser-failure-${{ matrix.group }}
          path: test-results/package/browser.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: [javascript, heating, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Report package validation results
        env:
          JAVASCRIPT_RESULT: ${{ needs.javascript.result }}
          HEATING_RESULT: ${{ needs.heating.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          {
            echo "### Package validation"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            printf '| JavaScript tests and bundle | %s |\n' "$JAVASCRIPT_RESULT"
            printf '| Heating kit | %s |\n' "$HEATING_RESULT"
            printf '| Chromium, WebKit and standalone browser checks | %s |\n' "$BROWSER_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$JAVASCRIPT_RESULT" != success || "$HEATING_RESULT" != success || "$BROWSER_RESULT" != success ]]; then
            echo "::error::Package validation requires all checks to pass."
            exit 1
          fi
