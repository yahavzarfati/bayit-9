blueprint:
  name: Bayit 9 - Start timed heating
  description: Start one selected heater switch after arming its dedicated Home Assistant timer.
  domain: script
  homeassistant:
    min_version: 2026.11.2
  input:
    heater_switch:
      name: Heater switch
      description: Select a single switch that controls this heater. Do not select a group.
      selector:
        entity:
          filter:
            - domain: switch
    heater_timer:
      name: Dedicated timer
      description: Select the heater's native Timer helper. Enable Restore on the helper.
      selector:
        entity:
          filter:
            - domain: timer
    cutoff_automation:
      name: Cutoff automation
      description: Select the enabled Bayit 9 timed heating cutoff instance for the same switch and timer.
      selector:
        entity:
          filter:
            - domain: automation
    max_minutes:
      name: Maximum run time
      description: The maximum duration accepted per run. Match the dashboard profile's maximum.
      default: 60
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
          mode: box

mode: single
max_exceeded: silent
fields:
  duration:
    name: Duration
    description: Whole minutes to run the heater.
    required: true
    selector:
      number:
        min: 1
        max: 60
        step: 1
        unit_of_measurement: min
        mode: box

sequence:
  - variables:
      heater: !input heater_switch
      countdown: !input heater_timer
      cutoff: !input cutoff_automation
      configured_max: !input max_minutes
  - if:
      - condition: template
        value_template: >-
          {{ not (heater is string and heater is match('^switch[.][a-z0-9_]+$')
            and countdown is string and countdown is match('^timer[.][a-z0-9_]+$')
            and cutoff is string and cutoff is match('^automation[.][a-z0-9_]+$')
            and state_attr(heater, 'entity_id') is none) }}
    then:
      - stop: Timed heating requires a dedicated single switch, timer, and cutoff automation.
        error: true
  - if:
      - condition: template
        value_template: >-
          {{ not (duration is defined and duration is integer
            and configured_max is number and configured_max is not boolean
            and 1 <= duration <= configured_max <= 60) }}
    then:
      - stop: The duration must be whole minutes within the configured range.
        error: true
  - if:
      - condition: template
        value_template: >-
          {{ not (is_state(heater, 'off') and is_state(countdown, 'idle')
            and state_attr(countdown, 'restore') is sameas true and is_state(cutoff, 'on')) }}
    then:
      - stop: Start requires the heater off, its timer idle with Restore enabled, and its cutoff automation enabled.
        error: true
  - action: timer.start
    target:
      entity_id: !input heater_timer
    data:
      duration: "{{ duration * 60 }}"
  - if:
      - condition: template
        value_template: >-
          {{ not (is_state(countdown, 'active')
            and 0 < as_timestamp(state_attr(countdown, 'finishes_at'), 0) - as_timestamp(now()) <= duration * 60 + 1
            and is_state(heater, 'off') and is_state(cutoff, 'on')) }}
    then:
      - action: timer.cancel
        target:
          entity_id: !input heater_timer
        continue_on_error: true
      - stop: The countdown could not be confirmed. Heating was not started.
        error: true
  - action: switch.turn_on
    target:
      entity_id: !input heater_switch
    continue_on_error: true
  - wait_template: >-
      {{ is_state(heater, 'on') or not is_state(countdown, 'active') }}
    timeout: "00:00:08"
    continue_on_timeout: true
  - if:
      - condition: template
        value_template: >-
          {{ not (is_state(heater, 'on') and is_state(cutoff, 'on')
            and is_state(countdown, 'active')
            and as_timestamp(state_attr(countdown, 'finishes_at'), 0) > as_timestamp(now())) }}
    then:
      - action: timer.cancel
        target:
          entity_id: !input heater_timer
        continue_on_error: true
      - action: switch.turn_off
        target:
          entity_id: !input heater_switch
        continue_on_error: true
      - stop: The heater and countdown did not both confirm an active run.
        error: true
